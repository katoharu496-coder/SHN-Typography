<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHN Typography</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->
    <canvas id="bg"></canvas>

    <!-- Header -->
    <header>

        <a href="index.html" class="logo">
            <img src="img/logo.png" alt="SHN Typography">
        </a>

        <nav>
            <a href="fonts.html">Phông Chữ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html">Liên hệ</a>
            <a href="donate.html">Ủng hộ</a>
        </nav>

    </header>

    <!-- Hero -->
    <main>

        <section class="hero">

            <img src="img/logo1.png" alt="SHN Typography" class="hero-logo">

            <p>Kho lưu trữ và chia sẻ phông chữ Việt hóa chất lượng cao.</p>

            <div class="cards">

                <a href="fonts.html" class="card">
                    <img src="img/type.svg" alt="Phông chữ">
                    <h2>Phông Chữ</h2>
                    <p>Khám phá bộ font Việt hóa</p>
                </a>

                <a href="about.html" class="card">
                    <img src="img/book-open-text.svg" alt="Giới thiệu">
                    <h2>Giới thiệu</h2>
                    <p>Tìm hiểu về SHN Typography</p>
                </a>

                <a href="contact.html" class="card">
                    <img src="img/user-star.svg" alt="Liên hệ">
                    <h2>Liên hệ</h2>
                    <p>Góp ý, báo lỗi hoặc hợp tác</p>
                </a>

                <a href="donate.html" class="card">
                    <img src="img/hand-heart.svg" alt="Ủng hộ">
                    <h2>Ủng hộ</h2>
                    <p>Giúp dự án phát triển lâu dài</p>
                </a>

            </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
